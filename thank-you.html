<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Thank you for reaching out." />
  <title>Thank You | Sem Out</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon-48x48.png" type="image/png" sizes="48x48" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <section class="hero section-gradient" id="thank-you">
      <div class="container hero-content">
        <div>
          <p class="eyebrow">Message received</p>
          <h1>Thanks for reaching out.</h1>
          <p class="hero-copy">Your message was sent successfully. I will get back to you as soon as possible.</p>
          <div class="hero-actions">
            <a class="button primary" href="index.html">Back to home</a>
            <a class="button secondary" href="index.html#projects">View projects</a>
          </div>
        </div>
        <div class="hero-card">
          <div class="card-panel">
            <p><strong>What happens next?</strong></p>
            <ul>
              <li>I review your message details.</li>
              <li>I respond by email with next steps.</li>
              <li>We discuss goals, timeline, and scope.</li>
            </ul>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
